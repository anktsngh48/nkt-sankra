<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>NKT Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef0f3;
      --text: #1b1e27;
      --muted: #667085;
      --field: #ffffff;
      --line: #d9dde5;
      --edge: rgba(27, 30, 39, .07);
      --on-card: #1b1e27;
      /* soft card colours: sage, mist, sand, mauve, sea glass, dusty rose */
      --c0: #dce5db;
      --c1: #dae4ee;
      --c2: #ece3d1;
      --c3: #e6dde7;
      --c4: #d5e6e4;
      --c5: #e7dbde;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101218;
        --text: #eef0f6;
        --muted: #98a1b5;
        --field: #1a1d27;
        --line: #2a2e3b;
        --edge: rgba(255, 255, 255, .06);
        --on-card: #eef0f6;
        --c0: #243028;
        --c1: #232e3b;
        --c2: #332e22;
        --c3: #2f2733;
        --c4: #213332;
        --c5: #33282c;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      /* keeps content clear of camera notches and gesture bars when the app runs fullscreen */
      padding:
        max(30px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(40px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }
    main { max-width: 620px; margin: 0 auto; }

    /* ---------- Header ---------- */
    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 10vw, 3.3rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
    }
    .search { margin: 20px 0 20px; }
    .search input {
      display: block;
      width: 100%;
      height: 50px;
      padding: 0 18px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 16px; /* 16px stops phones zooming in when the box is tapped */
      font-weight: 500;
      -webkit-appearance: none;
      appearance: none;
    }
    .search input::placeholder { color: var(--muted); font-weight: 400; }
    .search input:focus { outline: none; border-color: var(--text); }

    /* ---------- Cards: one per row ---------- */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 76px;
      padding: 18px 18px 18px 22px;
      border: 1px solid var(--edge);
      border-radius: 20px;
      background: var(--c);
      color: var(--on-card);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease;
    }
    .text { flex: 1; min-width: 0; }
    .name {
      display: block;
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
    }
    .note {
      display: block;
      margin-top: 4px;
      font-size: .92rem;
      line-height: 1.4;
      opacity: .74;
    }
    .chev { flex: none; width: 20px; height: 20px; opacity: .4; }
    .card:active { transform: scale(.985); }
    .card:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    @media (hover: hover) {
      .card:hover { transform: translateY(-2px); }
      .card:active { transform: scale(.99); }
    }

    /* ---------- Web suggestions (shown only when nothing in the list matches) ---------- */
    .web-label {
      margin: 8px 2px -2px;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .card.suggestion { min-height: 60px; padding: 14px 18px 14px 22px; }
    .card.suggestion .name { font-size: 1.02rem; font-weight: 500; }
    .card.web-main .name { font-size: 1.12rem; }

    .empty { max-width: 46ch; padding: 22px 2px; color: var(--muted); line-height: 1.5; }
    .empty code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; color: var(--text); }

    @media (min-width: 720px) {
      body { padding-top: max(56px, env(safe-area-inset-top)); }
      .card { padding: 20px 22px 20px 26px; }
      .card.suggestion { padding: 16px 22px 16px 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">NKT Tools</h1>

    <div class="search">
      <input id="search" type="search" placeholder="Find a project" aria-label="Find a project"
             autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>

    <div class="list" id="list"></div>
    <noscript><p class="empty">This page needs JavaScript to show your projects.</p></noscript>
  </main>

  <script>
    "use strict";

    /* =====================================================================
       EDIT HERE
       Each project is one line between { and }. Only name and link are needed.
         name   what the card says
         link   the address the card opens (https://… is added if you leave it out)
         note   one short line under the name. Leave it out on cards that don't need one.
         color  your own card colour, for example "#e8dfc8". Pick a soft, light colour. (optional)
       Keep the comma at the end of every project. The order here is the order on screen.
       ===================================================================== */
    const PAGE_TITLE = "NKT Tools";

    const PROJECTS = [
       { name: "Spends tracker",  link: "https://asasasasasas.com",  note: "Log what you spend and see where it goes" },
      { name: "Collage maker",  link: "lage/",  note: "Creates collage from photos" },
      { name: "Video maker",  link: "https://eg.com/",  note: "Create and edit videos, add images and text" },
    ];
    /* ===================================================================== */

    const PALETTE_SIZE = 6; // matches --c0 to --c5 in the styles above
    const ALLOWED = ["http:", "https:", "mailto:", "tel:"];
    const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

    const $ = id => document.getElementById(id);
    const list = $("list"), search = $("search");

    document.title = PAGE_TITLE;
    $("title").textContent = PAGE_TITLE;

    function clean(p, index) {
      if (!p || !String(p.name || "").trim() || !String(p.link || "").trim()) {
        console.warn(`Project ${index + 1} needs both a name and a link, so it was skipped.`);
        return null;
      }
      let link = String(p.link).trim();
      if (!/^[a-z][a-z0-9+.-]*:/i.test(link)) link = "https://" + link;
      let url;
      try { url = new URL(link); } catch { console.warn(`"${p.name}" has a link that is not valid, so it was skipped.`); return null; }
      if (!ALLOWED.includes(url.protocol)) { console.warn(`"${p.name}" has a link type that is not allowed, so it was skipped.`); return null; }
      return {
        name: String(p.name).trim(),
        link: url.href,
        note: p.note ? String(p.note).trim() : "",
        color: p.color ? String(p.color).trim() : ""
      };
    }

    // Colours are given out in order, so a card keeps its colour while you search
    const projects = PROJECTS.map(clean).filter(Boolean).map((p, i) => ({ ...p, slot: i % PALETTE_SIZE }));

    function makeCard(p) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = p.link;
      if (p.color) {
        a.style.setProperty("--c", p.color);
        a.style.setProperty("--on-card", "#1b1e27"); // custom colours are meant to be light, so the text stays dark
      } else {
        a.style.setProperty("--c", `var(--c${p.slot})`);
      }

      const text = document.createElement("span");
      text.className = "text";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.name;
      text.append(name);

      if (p.note) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = p.note;
        text.append(note);
      }

      const chev = document.createElement("span");
      chev.innerHTML = CHEVRON; // fixed icon, no user text involved
      a.append(text, chev.firstChild);
      return a;
    }

    function emptyMessage(text, code) {
      const div = document.createElement("div");
      div.className = "empty";
      div.append(text);
      if (code) {
        const c = document.createElement("code");
        c.textContent = code;
        div.append(" ", c, ".");
      }
      return div;
    }

    /* =====================================================================
       DuckDuckGo fallback
       When the typed text matches nothing in PROJECTS, the page switches to
       web-search mode: it shows DuckDuckGo's live suggestions, and tapping
       one (or pressing Enter) opens DuckDuckGo with that search.
       ===================================================================== */
    const DDG_SEARCH = "https://duckduckgo.com/?q=";
    const DDG_SUGGEST = "https://duckduckgo.com/ac/?q=";
    const SUGGEST_DELAY = 180;   // ms to wait after the last keystroke before asking DuckDuckGo
    const SUGGEST_TIMEOUT = 4000; // ms before giving up on a slow connection
    const MAX_SUGGESTIONS = 8;

    const suggestCache = new Map();
    let suggestTimer = 0;
    let suggestRun = 0; // bumps on every change, so late answers for old text are ignored

    function ddgUrl(q) { return DDG_SEARCH + encodeURIComponent(q); }

    function makeWebCard(label, q, extraClass, slot) {
      const card = makeCard({ name: label, link: ddgUrl(q), note: "", slot });
      card.classList.add(extraClass);
      return card;
    }

    // Asks DuckDuckGo for suggestions. Tries a normal request first, then falls back to a script tag (JSONP).
    function fetchSuggestions(q) {
      return fetchJson(q).catch(() => fetchJsonp(q));
    }

    function parseSuggestions(data) {
      if (!Array.isArray(data)) return [];
      return data
        .map(item => (item && typeof item.phrase === "string") ? item.phrase.trim() : "")
        .filter(Boolean)
        .slice(0, MAX_SUGGESTIONS);
    }

    function fetchJson(q) {
      const ctrl = typeof AbortController === "function" ? new AbortController() : null;
      const timer = setTimeout(() => ctrl && ctrl.abort(), SUGGEST_TIMEOUT);
      return fetch(DDG_SUGGEST + encodeURIComponent(q), ctrl ? { signal: ctrl.signal } : undefined)
        .then(r => { if (!r.ok) throw new Error("bad response"); return r.json(); })
        .then(parseSuggestions)
        .finally(() => clearTimeout(timer));
    }

    function fetchJsonp(q) {
      return new Promise((resolve, reject) => {
        const cb = "ddg_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
        const script = document.createElement("script");
        const done = () => { clearTimeout(timer); delete window[cb]; script.remove(); };
        const timer = setTimeout(() => { done(); reject(new Error("timeout")); }, SUGGEST_TIMEOUT);
        window[cb] = data => { done(); resolve(parseSuggestions(data)); };
        script.onerror = () => { done(); reject(new Error("blocked")); };
        script.src = DDG_SUGGEST + encodeURIComponent(q) + "&callback=" + cb;
        document.head.append(script);
      });
    }

    /* =====================================================================
       Website addresses
       If what's typed or pasted looks like a website (https://site.com/page,
       www.site.com, site.in/path, localhost:3000), an "Open" card is shown
       that goes straight to it. Only http and https addresses are accepted.
       ===================================================================== */
    const BARE_ADDRESS = new RegExp(
      "^(?:" +
        "(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}" + // site.com, www.site.co.in
        "|localhost" +
        "|\\d{1,3}(?:\\.\\d{1,3}){3}" +                       // 192.168.1.5
      ")(?::\\d{2,5})?(?:[/?#]\\S*)?$", "i");

    function parseWebAddress(raw) {
      const text = String(raw || "").trim();
      if (!text || /\s/.test(text)) return null;
      const hasScheme = /^https?:\/\//i.test(text);
      if (!hasScheme && !BARE_ADDRESS.test(text)) return null;
      const local = /^(localhost|\d{1,3}(\.\d{1,3}){3})(?=[:/?#]|$)/i.test(text);
      try {
        const url = new URL(hasScheme ? text : (local ? "http://" : "https://") + text);
        if (!/^https?:$/.test(url.protocol) || !url.hostname) return null;
        return url.href;
      } catch { return null; }
    }

    function prettyHost(href) {
      try { return new URL(href).hostname.replace(/^www\./i, ""); } catch { return href; }
    }

    function renderWeb(q) {
      list.replaceChildren();

      // Always available: search for exactly what was typed
      list.append(makeWebCard(`Search DuckDuckGo for “${q}”`, q, "web-main", 1));

      const holder = document.createElement("div");
      holder.className = "list";
      list.append(holder);

      const paint = suggestions => {
        const fresh = suggestions.filter(s => s.toLowerCase() !== q.toLowerCase());
        holder.replaceChildren();
        if (!fresh.length) return;
        const label = document.createElement("div");
        label.className = "web-label";
        label.textContent = "DuckDuckGo suggestions";
        holder.append(label);
        fresh.forEach((s, i) => holder.append(makeWebCard(s, s, "suggestion", (i + 2) % PALETTE_SIZE)));
      };

      if (suggestCache.has(q)) { paint(suggestCache.get(q)); return; }

      const run = ++suggestRun;
      clearTimeout(suggestTimer);
      suggestTimer = setTimeout(() => {
        fetchSuggestions(q)
          .then(s => {
            suggestCache.set(q, s);
            if (run === suggestRun) paint(s); // ignore answers for text that has since changed
          })
          .catch(() => { /* offline or blocked: the "Search DuckDuckGo for …" card still works */ });
      }, SUGGEST_DELAY);
    }

    function render() {
      const raw = search.value.trim();
      const q = raw.toLowerCase();
      const addr = parseWebAddress(raw);
      const shown = q
        ? projects.filter(p => (p.name + " " + p.note).toLowerCase().includes(q))
        : projects;

      suggestRun++;               // cancels any suggestion request still on its way
      clearTimeout(suggestTimer);
      list.replaceChildren();

      if (addr) {
        // A website address was typed or pasted: offer to open it directly
        const open = makeCard({ name: `Open ${prettyHost(addr)}`, link: addr, note: addr, slot: 1 });
        open.classList.add("web-main");
        list.append(open);
        if (shown.length) list.append(...shown.map(makeCard)); // projects that also match still show
        else list.append(makeWebCard(`Search DuckDuckGo for “${raw}” instead`, raw, "web-main", 3));
        return;
      }
      if (!projects.length && !q) {
        list.append(emptyMessage("No projects yet. Add your first one in the list called", "PROJECTS"));
        return;
      }
      if (!shown.length) {
        renderWeb(search.value.trim()); // nothing matches in the list, so act as a DuckDuckGo search bar
        return;
      }
      list.append(...shown.map(makeCard));
    }

    search.addEventListener("input", render);

    // Enter searches DuckDuckGo, but only when nothing in the list matches
    search.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const raw = search.value.trim();
      const q = raw.toLowerCase();
      if (!q) return;
      const addr = parseWebAddress(raw);
      if (addr) { window.location.href = addr; return; } // a pasted website opens directly
      const hasMatch = projects.some(p => (p.name + " " + p.note).toLowerCase().includes(q));
      if (!hasMatch) window.location.href = ddgUrl(raw);
    });

    render();
  </script>
</body>
</html>
